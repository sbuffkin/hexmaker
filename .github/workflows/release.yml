name: Release Obsidian plugin

on:
  push:
    branches:
      - master

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      version: ${{ steps.version.outputs.version }}
      released: ${{ steps.check.outputs.exists == 'false' }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from manifest
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> $GITHUB_OUTPUT

      - name: Check if release already exists
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ steps.version.outputs.version }}" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          if git ls-remote --tags origin "${{ steps.version.outputs.version }}" | grep -q .; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Use Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        if: steps.check.outputs.exists == 'false'
        run: npm ci

      - name: Run tests
        if: steps.check.outputs.exists == 'false'
        run: npm test

      # Runs the scan Obsidian applies to releases on this commit first, so a
      # version with review errors never gets published (.github/OBSIDIAN_REVIEW.md).
      - name: Obsidian review gate (preview scan)
        if: steps.check.outputs.exists == 'false'
        env:
          OBSIDIAN_COMMUNITY_COOKIE: ${{ secrets.OBSIDIAN_COMMUNITY_COOKIE }}
        run: node dev/obsidian-review.mjs preview "$GITHUB_SHA"

      - name: Build plugin
        if: steps.check.outputs.exists == 'false'
        run: npm run build

      - name: Attest build provenance
        if: steps.check.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Tag and create release
        if: steps.check.outputs.exists == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.check.outputs.tag_exists }}" != "true" ]; then
            git tag -a "$version" -m "$version"
            git push origin "$version"
          fi
          gh release create "$version" \
            --title="$version" \
            --generate-notes \
            main.js manifest.json styles.css

  # Waits for the directory to pick up the new release and reports its scan.
  # A failure means the published version gets delisted unless it's fixed, so
  # it also opens an issue.
  obsidian-review:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Wait for the release scan
        env:
          OBSIDIAN_COMMUNITY_COOKIE: ${{ secrets.OBSIDIAN_COMMUNITY_COOKIE }}
        run: node dev/obsidian-review.mjs release "${{ needs.release.outputs.version }}"

      - name: Open an issue on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Obsidian review failed for ${{ needs.release.outputs.version }}" \
            --body "The community directory scan of release ${{ needs.release.outputs.version }} did not pass. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Dashboard: https://community.obsidian.md/account/plugins/hexmaker"
